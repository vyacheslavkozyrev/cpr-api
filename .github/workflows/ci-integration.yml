name: CI - Integration & Contract Tests

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch: {}

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-contract-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB_NAME || 'cpr_test' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-$(date +%Y%m%d)-${{ hashFiles('**/*.csproj') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Ensure pg_isready available (install client)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres to be ready
        run: |
          echo "Waiting for Postgres to be ready..."
          MAX=30; i=0; until pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cpr_test}; do
            i=$((i+1)); echo "waiting... ($i)"; sleep 2
            if [ $i -ge $MAX ]; then echo "Postgres did not become ready in time"; exit 1; fi
          done


      - name: Install dotnet-ef tool
        run: |
          dotnet tool install --global dotnet-ef --version 9.* || true
          export PATH="$HOME/.dotnet/tools:$PATH"

      - name: Restore
        run: dotnet restore src/CPR.sln

      - name: Setup obj/bin cache
        uses: actions/cache@v4
        with:
          path: |
            **/bin
            **/obj
          key: dotnet-build-${{ runner.os }}-$(date +%Y%m%d)-${{ hashFiles('**/*.csproj') }}

      - name: Build
        run: dotnet build src/CPR.sln --no-restore --configuration Release

      - name: Run EF migrations (apply seeds)
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB_NAME || 'cpr_test' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
          ConnectionStrings__DefaultConnection: ${{ env.CONNECTION_STRING }}
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          # prefer explicit DATABASE_URL style if provided, otherwise build from POSTGRES_*
          : ${CONNECTION_STRING:=Host=localhost;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}}
          echo "Using connection: ${CONNECTION_STRING}"
          dotnet ef database update --project src/CPR.Infrastructure --startup-project src/CPR.Api --configuration Release

      - name: Fast smoke test (fail-fast)
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB_NAME || 'cpr_test' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
          ConnectionStrings__DefaultConnection: ${{ env.CONNECTION_STRING }}
        run: |
          echo "Running fast smoke test: verify migrations and seed data"
          dotnet test tests/CPR.IntegrationTests/CPR.IntegrationTests.csproj --no-build -c Release --filter "FullyQualifiedName=CPR.IntegrationTests.MigrationSmokeTests.MigrationsHistory_Contains_AddSeedData" || (
            echo "Smoke test failed"; exit 1
          )

      - name: Run integration tests
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB_NAME || 'cpr_test' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
          ConnectionStrings__DefaultConnection: ${{ env.CONNECTION_STRING }}
        run: dotnet test tests/CPR.IntegrationTests/CPR.IntegrationTests.csproj --no-build -c Release --logger trx

      - name: Run contract tests
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB_NAME || 'cpr_test' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
          ConnectionStrings__DefaultConnection: ${{ env.CONNECTION_STRING }}
        run: dotnet test tests/CPR.ContractTests/CPR.ContractTests.csproj --no-build -c Release --logger trx
