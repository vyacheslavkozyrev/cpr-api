name: CI - Format and Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    name: dotnet-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install dotnet-format
        run: |
          dotnet tool install -g dotnet-format
          echo "## Add dotnet tools to PATH"
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Run dotnet format (verify no changes)
        run: dotnet format src/CPR.sln --verify-no-changes

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: format
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/CPR.sln

      - name: Build
        run: dotnet build src/CPR.sln --no-restore --configuration Release

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run unit tests (produce TRX)
        run: |
          mkdir -p ./test-results
          dotnet test tests/CPR.UnitTests/CPR.UnitTests.csproj --logger "trx;LogFileName=unit-tests.trx" --results-directory ./test-results

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./test-results/*.trx

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: test
    env:
      # Make DB name unique per workflow run and per job to avoid collisions
      DB_NAME: cpr_test_${{ github.run_id }}_${{ github.job }}
      JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval=5s --health-timeout=2s --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 && break || sleep 2
          done

      - name: Export DATABASE_URL for commands
        run: |
          echo "DATABASE_URL=Host=localhost;Port=5432;Database=${DB_NAME};Username=${{ secrets.POSTGRES_USER }};Password=${{ secrets.POSTGRES_PASSWORD }}" >> $GITHUB_ENV

      - name: Create per-run database
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "${DB_NAME}" ]; then echo "DB_NAME is empty"; exit 1; fi
          # Connect to the postgres maintenance DB to create the per-run database
          psql -h localhost -U ${{ secrets.POSTGRES_USER }} -d postgres -c "CREATE DATABASE \"${DB_NAME}\";"

      - name: Apply EF migrations
        run: |
          echo "Ensure dotnet-ef is available"
          dotnet tool install --global dotnet-ef --version 8.* || dotnet tool update --global dotnet-ef --version 8.*
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
          echo "Restore solution before running migrations"
          dotnet restore src/CPR.sln
          dotnet ef database update --project src/CPR.Infrastructure --startup-project src/CPR.Api -- --connection "${DATABASE_URL}"

      - name: Run integration tests
        run: |
          mkdir -p ./test-results
          dotnet test tests/CPR.IntegrationTests/CPR.IntegrationTests.csproj --no-build --logger "trx;LogFileName=integration-tests.trx" --results-directory ./test-results

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./test-results/*.trx

      - name: Cleanup - drop per-run database
        if: always()
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set +e
          # Terminate any connections to the per-run database, then drop it
          psql -h localhost -U ${{ secrets.POSTGRES_USER }} -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='${DB_NAME}' AND pid<>pg_backend_pid();"
          psql -h localhost -U ${{ secrets.POSTGRES_USER }} -d postgres -c "DROP DATABASE IF EXISTS \"${DB_NAME}\";"
          set -e

  contract-test:
    name: Contract tests
    runs-on: ubuntu-latest
    needs: integration
    env:
      DB_NAME: cpr_test_${{ github.run_id }}_${{ github.job }}
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB_NAME || 'cpr_test' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Ensure pg_isready available (install client)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres to be ready
        run: |
          echo "Waiting for Postgres to be ready..."
          MAX=30; i=0; until pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cpr_test}; do
            i=$((i+1)); echo "waiting... ($i)"; sleep 2
            if [ $i -ge $MAX ]; then echo "Postgres did not become ready in time"; exit 1; fi
          done

      - name: Install dotnet-ef tool
        run: |
          dotnet tool install --global dotnet-ef --version 9.* || true
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore solution
        run: dotnet restore src/CPR.sln

      - name: Run contract tests
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB_NAME || 'cpr_test' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ConnectionStrings__DefaultConnection: ${{ env.CONNECTION_STRING }}
        run: |
          echo "Running contract tests"
          dotnet test tests/CPR.ContractTests/CPR.ContractTests.csproj --no-build -c Release --logger trx

      - name: Upload contract test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: ./test-results/*.trx
