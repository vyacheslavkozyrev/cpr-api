name: CI - Format and Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    name: dotnet-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install dotnet-format
        run: |
          dotnet tool install -g dotnet-format
          echo "## Add dotnet tools to PATH"
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Run dotnet format (verify no changes)
        run: dotnet format src/CPR.sln --verify-no-changes

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: format
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/CPR.sln

      - name: Build
        run: dotnet build src/CPR.sln --no-restore --configuration Release

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run unit tests (produce TRX)
        run: |
          mkdir -p ./test-results
          dotnet test tests/CPR.UnitTests/CPR.UnitTests.csproj --logger "trx;LogFileName=unit-tests.trx" --results-directory ./test-results

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./test-results/*.trx
